<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Basenplaner</title>
  <meta name="description" content="Minecraft-Base in 3D planen: eigene Welt laden, umsehen und fliegen, Häuser setzen, Schicht für Schicht nachbauen." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='2' y='2' width='12' height='12' rx='2' fill='%237F5FE8'/%3E%3C/svg%3E" />
</head>
<body>
  <div id="app">
    <div id="three" class="view"></div>
    <div id="start" class="start" hidden></div>
    <aside id="side" class="panel" aria-label="Bauen" hidden></aside>
    <div id="tools" class="tools" hidden></div>
    <div id="status" class="status" aria-live="polite"></div>
    <section id="mini" class="mini" aria-label="Karte" hidden>
      <div id="mini-map" class="mini-map"></div>
      <div class="mini-bar">
        <span id="mini-readout" class="small"></span>
        <span class="grow"></span>
        <button class="btn ghost small icon" id="mini-toggle" title="Karte groß (M)"></button>
      </div>
    </section>
    <section id="guide" class="guide" aria-label="Bauanleitung" hidden></section>
    <div id="toast" class="toast" role="status" hidden></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
